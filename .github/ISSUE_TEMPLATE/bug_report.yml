name: Bug report
description: Report a reproducible problem
body:
  - type: markdown
    attributes:
      value: Do not include profile exports, personal career data, credentials, or private provider responses.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      render: text
    validations:
      required: true
