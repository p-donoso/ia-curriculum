name: Feature request
description: Suggest a user-facing improvement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What are you trying to do?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: How should the app help?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
