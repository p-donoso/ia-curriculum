name: Publish documentation wiki

on:
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/build-wiki.py', '.github/workflows/wiki.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-wiki
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Generate wiki
        run: python3 scripts/build-wiki.py --output "$RUNNER_TEMP/wiki-content" --repository "$GITHUB_REPOSITORY"
      - name: Publish wiki
        env:
          WIKI_TOKEN: ${{ secrets.WIKI_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$WIKI_TOKEN" ]]; then
            echo 'Configure the WIKI_TOKEN repository secret before publishing.' >&2
            exit 1
          fi
          cat > "$RUNNER_TEMP/wiki-askpass" <<'ASKPASS'
          #!/bin/sh
          case "$1" in
            *Username*) echo x-access-token ;;
            *Password*) echo "$WIKI_TOKEN" ;;
          esac
          ASKPASS
          chmod 700 "$RUNNER_TEMP/wiki-askpass"
          export GIT_ASKPASS="$RUNNER_TEMP/wiki-askpass" GIT_TERMINAL_PROMPT=0
          git clone "https://github.com/${GITHUB_REPOSITORY}.wiki.git" "$RUNNER_TEMP/wiki-repo" || {
            echo 'Create the first wiki page in GitHub and check token access.' >&2
            exit 1
          }
          rsync -a --delete --exclude=.git/ "$RUNNER_TEMP/wiki-content/" "$RUNNER_TEMP/wiki-repo/"
          cd "$RUNNER_TEMP/wiki-repo"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --all
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "docs: sync from ${GITHUB_SHA}"
          git push origin HEAD
